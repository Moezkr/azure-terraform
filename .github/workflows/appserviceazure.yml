# GitHub Actions: Deploy Node.js app to Azure App Service
# Docs: https://github.com/Azure/webapps-deploy

name: Deploy Node.js App to Azure - MyCustomApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set Node.js Version
        uses: actions/setup-node@v3
        with:
          node-version: '16.x' 

      - name: 📥 Install Dependencies & Build
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
      
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-azure.outputs.webapp-url }}
    
    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
      
      - name: 🚀 Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        id: deploy-to-azure
        with:
          app-name: 'app-service-azure' 
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }} 
